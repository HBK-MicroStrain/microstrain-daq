name: CI C++ (Linux)

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cpp:
    name: Build C++ (Linux)
    # Pinned to 22.04 — Ubuntu 24.04 dropped Mono from its apt repos and openDAQ's
    # RTGen code generation tool requires mono at build time.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-cpp-linux
