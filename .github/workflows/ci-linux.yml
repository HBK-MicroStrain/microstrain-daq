name: CI (Linux)

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-cpp:
    name: Build C++ (Linux)
    # Pinned to 22.04 — Ubuntu 24.04 dropped Mono from its apt repos and openDAQ's
    # RTGen code generation tool requires mono at build time.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build mono-complete

      # openDAQ is cloned and built from source via FetchContent on first run (~45 min).
      # The full build directory is cached so subsequent runs skip recompiling openDAQ.
      - name: Cache openDAQ FetchContent
        uses: actions/cache@v4
        with:
          path: cpp-build
          key: opendaq-deps-linux-3.30.3-v1

      - name: Configure
        run: >
          cmake
          -B cpp-build
          -S microstrain-daq-utils/daq_utils/cpp
          -DCMAKE_BUILD_TYPE=Release
          -G Ninja

      - name: Build
        run: cmake --build cpp-build --parallel

  build-csharp:
    name: Build C# (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache openDAQ.Net
        uses: actions/cache@v4
        id: cache-opendaq-net
        with:
          path: microstrain-daq-utils/daq_utils/csharp/opendaq-net
          key: opendaq-net-3.30.3.23

      - name: Download openDAQ.Net
        if: steps.cache-opendaq-net.outputs.cache-hit != 'true'
        run: |
          curl -L -o opendaq.net.nupkg \
            "https://github.com/openDAQ/openDAQ/releases/download/v3.30.3/opendaq.net.3.30.3.23.nupkg"
          unzip -o opendaq.net.nupkg -d microstrain-daq-utils/daq_utils/csharp/opendaq-net

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore microstrain-daq-utils/daq_utils/csharp/DaqUtils.csproj

      - name: Build
        run: >
          dotnet build
          microstrain-daq-utils/daq_utils/csharp/DaqUtils.csproj
          --configuration Release
          --no-restore
