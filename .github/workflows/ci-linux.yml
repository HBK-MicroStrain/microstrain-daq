name: CI (Linux)

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-cpp:
    name: Build C++ (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # openDAQ is cloned and built from source via FetchContent on first run (~45 min).
      # The _deps directory is cached so subsequent runs reuse the compiled openDAQ.
      - name: Cache openDAQ FetchContent
        uses: actions/cache@v4
        with:
          path: cpp-build/_deps
          key: opendaq-deps-linux-3.30.3

      - name: Configure
        run: >
          cmake
          -B cpp-build
          -S microstrain-daq-utils/daq_utils/cpp
          -DCMAKE_BUILD_TYPE=Release
          -G Ninja

      - name: Build
        run: cmake --build cpp-build --parallel

  build-csharp:
    name: Build C# (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore microstrain-daq-utils/daq_utils/csharp/DaqUtils.csproj

      - name: Build
        run: >
          dotnet build
          microstrain-daq-utils/daq_utils/csharp/DaqUtils.csproj
          --configuration Release
          --no-restore
