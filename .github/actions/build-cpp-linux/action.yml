name: Build C++ (Linux)
description: Checkout, install tools, restore cache, configure, and build the C++ library on Linux.

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ninja-build mono-complete

    - name: Cache openDAQ FetchContent
      uses: actions/cache@v4
      with:
        path: cpp-build
        key: opendaq-deps-linux-3.30.3-v1

    - name: Configure
      shell: bash
      run: >
        cmake
        -B cpp-build
        -S microstrain-daq-utils/daq_utils/cpp
        -DCMAKE_BUILD_TYPE=Release
        -G Ninja

    - name: Build
      shell: bash
      run: cmake --build cpp-build --parallel
