[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "microstrain-daq-utils"
dynamic = ["version"]
description = "An opinionated library that enhances working with openDAQ modules from MicroStrain by HBK."
requires-python = ">=3.9"
dependencies = [
    "opendaq==3.40.0",
]

[project.optional-dependencies]
jupyter = ["microstrain-daq-jupyter"]

[[project.maintainers]]
name = "MicroStrain by HBK"
email = "microstrainsupport@hbkworld.com"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["daq_utils/python"]
sources = {"daq_utils/python" = "daq_utils"}
